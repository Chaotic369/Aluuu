<div class="clock" id="clock">
  <div class="hand hour" id="hour"></div>
  <div class="hand minute" id="minute"></div>
  <div class="hand second" id="second"></div>
  <div class="center-point"></div>
</div>

<style>
  .clock {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: #ffffff;
    border: 8px solid #2c3e50;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.05);
    position: relative;
    margin: 40px auto;
  }
  .clock .number {
    position: absolute;
    width: 100%;
    height: 100%;
    text-align: center;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 600;
    font-size: 1.25rem;
    color: #2c3e50;
    transform: rotate(var(--rot));
    user-select: none;
  }
  .clock .number span {
    display: inline-block;
    transform: rotate(calc(-1 * var(--rot)));
    padding-top: 10px;
  }
  .hand {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 4px;
    z-index: 5;
  }
  .hand.hour {
    width: 6px;
    height: 70px;
    margin-left: -3px;
    background: #2c3e50;
  }
  .hand.minute {
    width: 4px;
    height: 100px;
    margin-left: -2px;
    background: #34495e;
  }
  .hand.second {
    width: 2px;
    height: 120px;
    margin-left: -1px;
    background: #e74c3c;
    z-index: 6;
  }
  .center-point {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    background: #e74c3c;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
  }
</style>

<script>
  (function () {
    const clock = document.getElementById('clock');
    for (let i = 1; i <= 12; i++) {
      const num = document.createElement('div');
      num.className = 'number';
      num.style.setProperty('--rot', `${i * 30}deg`);
      num.innerHTML = `<span>${i}</span>`;
      clock.appendChild(num);
    }

    const hourHand = document.getElementById('hour');
    const minHand = document.getElementById('minute');
    const secHand = document.getElementById('second');

    function update() {
      const now = new Date();
      const ms = now.getMilliseconds();
      const s = now.getSeconds() + ms / 1000;
      const m = now.getMinutes() + s / 60;
      const h = (now.getHours() % 12) + m / 60;

      secHand.style.transform = `rotate(${s * 6}deg)`;
      minHand.style.transform = `rotate(${m * 6}deg)`;
      hourHand.style.transform = `rotate(${h * 30}deg)`;

      requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  })();
</script>
